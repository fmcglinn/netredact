# Profile: secrets only  (this is the default -- an empty config behaves the same)
#
# Destination: inside the business. A colleague, your own ticket system, a
# backup you want to be safe if it leaks.
#
# Every credential, community string and password hash is destroyed. Everything
# else -- addressing, hostnames, descriptions, serials, MACs -- is kept exactly
# as it was, so the file is still fully readable and diffable against the live
# device.
#
# This profile is spelled out rather than left implicit, because what it keeps
# is nearly the whole config and that is the point: at defaults netredact makes
# one promise, and it is only about secrets.

[policy]
secrets   = "redact"   # <REMOVED>; pseudo is not available for secrets
text      = "keep"
identity  = "keep"
hostnames = "keep"
domains   = "keep"
usernames = "keep"
emails    = "keep"

[verify]
strict = true          # refuse to pass silently if something looks unredacted
