# Profile: extending netredact for gear it does not know
#
# Not a destination profile -- a demonstration of the three escape hatches:
# [[custom]] for patterns netredact has never seen, a named key in a family
# section for a built-in rule that is wrong for your environment, and [verify]
# for a token shape of your own that is not a finding.
#
# Use single-quoted TOML strings so backslashes reach the regex engine intact.

[secrets]
default = "redact"

# A built-in rule you disagree with is not disabled, it is given the `keep`
# action, by name, in its own family's section. Here: this fleet's `location`
# lines hold a rack label, not a street address, and the reviewer needs them.
[text]
default  = "hash"      # so the custom `text` rule below has something to do
location = "keep"

# `pattern` with NO capture groups is a PREFIX -- everything up to and
# including the keyword that introduces the value. netredact appends the value
# matcher itself, so you never handle quoting, JunOS ";" terminators or
# trailing `## SECRET-DATA` comments.
[[custom]]
name    = "acme-shared-key"
pattern = '\s*acme\s+shared-key\s+'
family  = "secrets"    # -> <REMOVED>, and pseudo is refused for secrets

# `action` gives one custom rule its own action, the way a named key does for
# a built-in one. Without it the rule takes its family's action.
[[custom]]
name    = "acme-debug-token"
pattern = '\s*debug-token\s+'
family  = "secrets"
action  = "hash"       # <SECRET-a1b2c3>, not <REMOVED>, for this one rule

[[custom]]
name    = "api-token"
pattern = '\s*api-token\s+'
family  = "secrets"

# `pattern` WITH capture groups declares its own targets: every group is acted
# on, everything outside them is kept verbatim. Use that when the value is not
# a single token -- here the whole remainder of the line is free text.
[[custom]]
name    = "site-notes"
pattern = '^\s*site-notes\s+(.+)$'
family  = "text"       # -> <DESC-a1b2c3>, because [policy] text = "hash"

# %VAL% expands to the value matcher as a capturing group, so a hand-written
# pattern can still borrow the quoting and terminator handling.
[[custom]]
name    = "acme-vault-ref"
pattern = '^\s*vault-ref\s+%VAL%\s+for\s+%VAL%\s*$'
family  = "secrets"    # both groups are targets

# stanza restricts a rule to the block it applies in: a JunOS top-level stanza,
# exactly like the built-in junos-community rule -- or `interfaces` / `vlans`,
# which also match the IOS-style block of that name, so one rule covers every
# vendor.
[[custom]]
name    = "acme-snmp-token"
pattern = '\s*acme-token\s+'
family  = "secrets"
stanza  = "snmp"

[verify]
# An asset tag of ours is 26 hex characters, which long-hex-left reports every
# time. Teach the verifier the shape instead of switching the check off.
ignore_patterns = ['\bACME-ASSET-[0-9A-F]{26}\b']
strict = true
