name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:        # manual dry run to TestPyPI

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # actions/checkout needs it; the top-level {} grants nothing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: release tag must match the built version
        if: github.event_name == 'release'
        run: |
          version=$(ls dist/*.whl | sed -E 's/.*netredact-([^-]+)-py3.*/\1/')
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # mints the OIDC token trusted publishing uses
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
