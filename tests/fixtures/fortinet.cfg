#config-version=FGVM64-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=fgtadmin
#conf_file_ver=71963manual
#buildno=2662
#global_vdom=1
config system global
    set admin-sport 8443
    set alias "FGT-EDGE-01"
    set hostname "FGT-EDGE-01"
    set timezone "Pacific/Auckland"
end
config system dns
    set primary 203.0.113.53
    unset secondary
end
config system admin
    edit "fgtadmin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2NwEdgeAdminPassEXAMPLEyqe7C3E5xUkAQjV3wIhLZbCxT1QYyqe7C3E5=
        set trusthost1 203.0.113.0 255.255.255.0
    next
    edit "svc-backup"
        set accprofile "prof_admin"
        set password ENC AK1FgtBackupPassEXAMPLE9wQwErTy==
    next
end
config system api-user
    edit "svc-ansible"
        set accprofile "prof_admin"
        set api-key ENC AK1FgtApiKeyEXAMPLEz0982kQ==
    next
end
config system snmp sysinfo
    set status enable
    set contact-info "netops@northwind.test"
    set description "Northwind edge firewall, DC1"
    set location "Northwind DC1 Rack A12"
end
config system snmp community
    edit 1
        set name "snmpNorthwindRO"
        config hosts
            edit 1
                set ip 203.0.113.99 255.255.255.255
            next
        end
        set trap-v1-status disable
    next
end
config system snmp user
    edit "snmpv3northwind"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC AK1SnmpAuthPassEXAMPLE0aQ==
        set priv-proto aes256
        set priv-pwd ENC AK1SnmpPrivPassEXAMPLE1bQ==
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping https ssh snmp
        set alias "TRANSIT: TransitCo - CID TC-772311"
        set description "uplink to TransitCo"
    next
    edit "internal1"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set alias "Customer ACME - Service 88412"
    next
    edit "vl-acme-88412"
        set vdom "root"
        set interface "internal1"
        set vlanid 412
        set ip 10.10.412.1 255.255.255.0
        set alias "ACME PTY LTD - VLAN 412"
    next
end
config system zone
    edit "CUSTOMER-EDGE"
        set interface "vl-acme-88412"
    next
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "ntp.northwind.test"
            set authentication enable
            set key-id 7
            set key "NtpSharedSecret123"
        next
    end
end
config user local
    edit "jsmith"
        set type password
        set passwd ENC AK1LocalUserPassEXAMPLE2cQ==
    next
end
config user ldap
    edit "northwind-ad"
        set server "203.0.113.20"
        set cnid "sAMAccountName"
        set dn "dc=northwind,dc=test"
        set username "CN=svc-bind,OU=Service,DC=northwind,DC=test"
        set password ENC AK1LdapBindPassEXAMPLE3dQ==
    next
end
config user radius
    edit "northwind-radius"
        set server "203.0.113.21"
        set secret ENC AK1RadiusSecretEXAMPLE4eQ==
        set nas-ip 203.0.113.2
    next
end
config vpn certificate local
    edit "Northwind_Edge"
        set password ENC AK1CertKeyPassEXAMPLE5fQ==
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFDjBABgkqhkiG9w0BBQ0wMzAbBgkqEXAMPLEprivatekeymaterial0123456789
-----END ENCRYPTED PRIVATE KEY-----
"
        set certificate "-----BEGIN CERTIFICATE-----
MIIDdzCCAl+gAwIBAgIEEXAMPLEcertificatematerialhere0123456789abcdef
-----END CERTIFICATE-----
"
    next
end
config vpn ipsec phase1-interface
    edit "to-branch-01"
        set interface "wan1"
        set peertype any
        set remote-gw 198.51.100.7
        set psksecret ENC AK1PskEXAMPLEsEcReTkEyMaTeRiAl==
        set ppk-secret ENC AK1PpkEXAMPLEsEcReT6gQ==
        set comments "IPsec to branch 01, CID NW-40012"
    next
end
config wireless-controller vap
    edit "northwind-corp"
        set ssid "NORTHWIND-CORP"
        set security wpa2-only-personal
        set passphrase ENC AK1WifiPassphraseEXAMPLE7hQ==
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
    edit 2
        set dst 10.10.412.0 255.255.255.0
        set device "vl-acme-88412"
    next
end
config firewall addrgrp
    edit "grp-acme"
        set member "addr-acme-lan"
    next
end
config firewall policy
    edit 1
        set name "acme-to-internet"
        set srcintf "CUSTOMER-EDGE" "vl-acme-88412"
        set dstintf "wan1"
        set action accept
        set comments "ACME PTY LTD - ticket NW-88412"
    next
end
config router bgp
    set as 64512
    config neighbor
        edit "198.51.100.7"
            set remote-as 64513
            set password ENC AK1BgpNeighborPassEXAMPLE8iQ==
        next
    end
end
config log syslogd setting
    set status enable
    set server "198.51.100.30"
end
