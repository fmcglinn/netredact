hostname test-rtr
ip domain-name northwind.test
!
key chain OSPF-KC
 key 1
  key-string 7 05080F1C2243
!
interface Vlan10
 ip address 172.16.5.9 255.255.255.240
 ip access-group 0.0.0.255 in
 vrrp 10 authentication text VrrpPass1
 ip igmp join-group 224.0.0.5
!
snmp-server user nxosadm network-admin auth md5 0x1234abcd priv 0x5678ef90 localizedkey
!
crypto key generate rsa modulus 2048
no ip http server
service password-encryption
no service password-recovery
!
vlan 300
 name ACME-CORP-DATA
!
route-map SET-COMM permit 10
 set community 64512:666 additive
!
ip route 0.0.0.0 0.0.0.0 172.16.5.1
